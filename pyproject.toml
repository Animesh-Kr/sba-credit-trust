[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sba-credit-trust"
version = "0.1.0"
description = "Calibrated, selective deep learning for small-business loan-default prediction"
authors = [{ name = "Animesh Kumar" }]
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501 long lines, E702 compact glue-statements in pipelines, B905 zip(strict=) — intentional.
ignore = ["E501", "E702", "B905"]

[tool.black]
line-length = 100
target-version = ["py310"]
